name: flutter_application_default
description: "Flutter project for a practice"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  uuid: ^4.5.2
  http: ^1.6.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  json_serializable: ^6.11.3
  build_runner: ^2.10.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: "Bitcount Grid Single"
      fonts:
        - asset: fonts/BitcountGridSingle.ttf

    - family: "Noto Sans"
      fonts:
        - asset: fonts/NotoSansVariableFontwdthwght.ttf
